# GoReleaser configuration for terraform-provider-truenas.
# Produces the cross-platform, checksummed, GPG-signed archives the
# Terraform Registry ingests. Triggered by the release workflow on a
# semver tag (vX.Y.Z).
#
# Requires (set in the release workflow / environment):
#   GPG_FINGERPRINT  — fingerprint of the signing key
#   the private signing key imported into the gpg keyring
version: 2

# Pin the project name so every artifact is named terraform-provider-truenas_*
# regardless of the git repository's name. The Terraform Registry requires
# this exact prefix; without it GoReleaser would derive the name from the repo.
project_name: terraform-provider-truenas

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: ['zip']
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

# Per-binary SBOMs in both standard formats, generated by syft and attached
# to the GitHub release. syft must be on PATH (the release workflow installs
# it). Local equivalent: `make sbom`.
sboms:
  - id: spdx
    artifacts: binary
    documents:
      - '{{ .Binary }}_{{ .Os }}_{{ .Arch }}.spdx.json'
    args: ["$artifact", "-q", "-o", "spdx-json=$document"]
  - id: cyclonedx
    artifacts: binary
    documents:
      - '{{ .Binary }}_{{ .Os }}_{{ .Arch }}.cdx.json'
    args: ["$artifact", "-q", "-o", "cyclonedx-json=$document"]

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
