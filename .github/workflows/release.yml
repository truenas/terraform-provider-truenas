# Release: build signed cross-platform archives for the Terraform Registry.
#
# Triggered by pushing a semver tag (vX.Y.Z). Requires two repository
# secrets:
#   GPG_PRIVATE_KEY  — the ASCII-armored private signing key
#   PASSPHRASE       — its passphrase (if any)
# The signing key must be RSA or DSA (the Registry does not accept the
# default ECC key type). Generate with: gpg --full-generate-key (choose RSA).
# The key's public half must be registered on the provider's Terraform
# Registry publisher settings so the Registry can verify the signature.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SBOMs are attached here, not by GoReleaser's `sboms:` pipe, so they do
      # not end up in SHA256SUMS (the Terraform Registry rejects that).
      - name: Generate and attach SBOMs
        # Pass the tag through the environment, never interpolated directly into
        # the run script, so a crafted tag name cannot inject shell commands.
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/gen-release-sboms.sh "$TAG"
