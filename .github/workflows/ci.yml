# Continuous integration: build, vet, format, lint, and unit tests.
#
# Runs on public GitHub runners. Acceptance tests are NOT run here — this
# provider's testing policy is "no mocks", so acceptance tests require a
# live TrueNAS box (plus, for some suites, directory servers and an
# HA pair). Those run on a self-hosted runner with lab access; see
# TEST-PLAN.md and the acceptance workflow.
name: CI

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Unit tests
        run: go test ./... -count=1 -timeout 10m
        # TF_ACC is unset, so acceptance tests skip and only pure-function
        # unit tests run.

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: govulncheck
        # Reachability-aware vulnerability scan: fails the build only when a
        # known-vulnerable symbol is actually reachable from this code. Catches
        # a dependency bump or new advisory that reintroduces a vulnerability.
        # The go.mod `go` directive also pins the toolchain setup-go installs,
        # so stdlib advisories fixed by a newer Go are covered here too.
        run: |
          # govulncheck@latest needs a newer Go to COMPILE than this project
          # targets, so let just its install fetch that toolchain. The scan
          # itself still runs under the go.mod toolchain (setup-go pins
          # GOTOOLCHAIN=local), so stdlib advisories are judged against the
          # Go version this provider actually builds with.
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Verify generated docs are up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "Generated docs are out of date. Run 'make generate' and commit."
            git --no-pager diff docs/
            exit 1
          fi

  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check SPDX license headers on Go files
        # Every Go source file must carry the SPDX MPL-2.0 identifier near the
        # top. Checked directly (year-agnostic) so it needs no external tool;
        # `copywrite headers` (see .copywrite.hcl) adds/normalizes them locally.
        run: |
          missing=$(git ls-files '*.go' | while read -r f; do
            head -3 "$f" | grep -q 'SPDX-License-Identifier: MPL-2.0' || echo "$f"
          done)
          if [ -n "$missing" ]; then
            echo "Go files missing the SPDX MPL-2.0 header:"; echo "$missing"; exit 1
          fi

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: check
